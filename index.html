<!DOCTYPE html>
<html>

<head>
  <title>Rock-Paper-Scissors</title>
  <link rel="stylesheet" href="rps-game.css">
</head>

<body>
  <p class="heading">Rock Paper Scissors</p>

  <div class="cards">

    <div class="option-card">

      <div class="thumbnail-box">
        <img class="thumbnail" src="Image/rock.png">
      </div>

      <div class="button-box">
        <button onclick="
       playGame('rock');
      " class="option-button">Rock</button>
      </div>

    </div>


    <div class="option-card">

      <div class="thumbnail-box">
        <img class="thumbnail" src="Image/paper.png">
      </div>

      <div class="button-box">
        <button onclick="
       playGame('paper');
       " class="option-button">Paper</button>
      </div>

    </div>

    <div class="option-card">

      <div class="thumbnail-box">
        <img class="thumbnail" src="Image/scissor.png">
      </div>

      <div class="button-box">
        <button onclick="
        playGame('scissors');
       " class="option-button">Scissors</button>
      </div>

    </div>
  </div>

  <div class="result-area">
    <h4 class="result-heading">Result</h4>
    <p class="js-result"></p>
    <p class="js-moves"></p>
    <p class="js-score"></p>
  </div>

  <div class="reset-area">
    <button onclick="
    score.win = 0;
    score.lose = 0;
    score.tie = 0;
    localStorage.removeItem('score');
    updateScore();
  " class="reset-button">Reset Score</button>
  </div>



  <script>

    let score = JSON.parse(localStorage.getItem('score')) || { win: 0, lose: 0, tie: 0 };

    updateScore();

    function playGame(playerMove) {
      const computerMove = pickComputerMove();
      let result;

      if (playerMove === 'rock') {
        if (computerMove === 'Rock') {
          result = 'Tie';
        } else if (computerMove === 'Paper') {
          result = 'You Lost';
        } else {
          result = 'You Won';
        }

      } else if (playerMove === 'paper') {
        if (computerMove === 'Rock') {
          result = 'You Won';
        } else if (computerMove === 'Paper') {
          result = 'Tie';
        } else {
          result = 'You Lost';
        }

      } else if (playerMove === 'scissors') {
        if (computerMove === 'Rock') {
          result = 'You Lost';
        } else if (computerMove === 'Paper') {
          result = 'You Won';
        } else {
          result = 'Tie';
        }
      }

      if (result === 'You Won') {
        score.win += 1;
      } else if (result === 'You Lost') {
        score.lose += 1;
      } else {
        score.tie += 1;
      }

      localStorage.setItem('score', JSON.stringify(score));

      updateScore();

      document.querySelector('.js-result').innerHTML = result;

      document.querySelector('.js-moves').innerHTML = `Your move ${playerMove} - Computer move ${computerMove}`;
    }

    function updateScore() {
      document.querySelector('.js-score').innerHTML = `Wins: ${score.win}, Losses: ${score.lose}, Ties: ${score.tie}`;
    }

    function pickComputerMove() {
      const randomNumber = Math.random(); // Takes a random number in the range [0, 1) //
      let computerMove = '';

      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'Rock';
      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'Paper';
      } else {
        computerMove = 'Scissors';
      }
      return computerMove;
    }
  </script>
</body>

</html>
